<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><title>Vortex · Private delivery</title>
<style>

:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}.stat{padding:15px;border:1px solid var(--border);border-radius:15px;background:rgba(255,255,255,.015)}.stat b{display:block;font-size:22px;letter-spacing:-.03em}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:5px}button,.linkbutton{width:100%;border:1px solid rgba(155,199,255,.42);border-radius:13px;padding:14px;color:#06101d;background:linear-gradient(135deg,#88c7ff,#6f8dff 58%,#806df7);font:700 13px inherit;cursor:pointer;box-shadow:0 11px 28px rgba(80,126,255,.22);transition:transform .2s,filter .2s}button:hover{transform:translateY(-1px);filter:brightness(1.08)}button:disabled{cursor:default;opacity:.55;transform:none}button:focus-visible,a:focus-visible{outline:2px solid #a9d3ff;outline-offset:4px}.progress{height:5px;background:rgba(255,255,255,.06);border-radius:20px;overflow:hidden;margin:23px 0 10px}.fill{height:100%;width:0;background:linear-gradient(90deg,#70b5ff,#9b73ff);transition:width .35s}.line{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.foot{margin-top:23px;color:#677492;font-size:11px}.foot a{color:#9aacd0;text-decoration:none}.privacy{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:#7f91b5;margin-top:20px}.privacy svg{width:14px;height:14px}.error{color:#ff9eaf} [hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}@media(max-width:480px){.card{padding:27px 21px}h1{font-size:24px}}

<script>/*VORTEX_CODEC*/</script><script>
(()=>{'use strict';const W=VortexWire,$=s=>document.getElementById(s);let secret,manifest,share,proof,token,started=false,loaded=0;const size=n=>{const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`};
 const error=e=>{$('title').textContent='Delivery unavailable';$('message').textContent=e.message||'Please request a new download link from the sender.';$('message').className='error';$('download').disabled=true};
 async function* file(e){const key=await W.key(secret,share,'file '+e.id),prefix=W.unb64(e.prefix);let received=0;for(let n=0;n<e.count;n++){const r=await W.request(`/receive/piece/${share}/${e.start+n}`,{headers:{Authorization:'Bearer '+token}});const cipher=new Uint8Array(await r.arrayBuffer());if(cipher.length>W.CHUNK+16)throw Error('Invalid encrypted piece');const plain=await W.decryptChunk(key,prefix,cipher,share,e.id,n,e.size);const expected=Math.min(W.CHUNK,e.size-received);if(plain.length!==expected)throw Error('Download integrity check failed');received+=plain.length;loaded+=plain.length;const pct=manifest.bytes?loaded/manifest.bytes*100:100;$('fill').style.width=pct+'%';$('percent').textContent=Math.floor(pct)+'%';$('status').textContent=`${size(loaded)} of ${size(manifest.bytes)}`;yield plain;}if(received!==e.size)throw Error('Download was truncated')}
 async function start(){if(started)return;started=true;$('download').disabled=true;$('progress').hidden=false;$('message').className='';$('message').textContent='Downloading securely. Keep this page open until the delivery finishes.';try{if(!token){const result=await W.json(`/receive/claim/${share}`,{proof});token=result.token;}loaded=0;const files=manifest.entries.filter(e=>!e.folder);const single=manifest.entries.length===1&&files.length===1;const name=single?files[0].path.split('/').pop():'Vortex delivery.zip';const length=single?files[0].size:W.zipSize(manifest.entries);const iterator=single?file(files[0]):W.zip(manifest.entries,file);await W.download(W.stream(iterator),name,length);await W.json(`/receive/complete/${share}`,undefined,token);secret.fill(0);token=null;$('title').textContent='Delivery complete.';$('message').textContent='Your download has been sent to your browser. The private delivery link is now retired.';$('fill').style.width='100%';$('percent').textContent='100%';$('status').textContent='Complete';$('download').hidden=true;}catch(e){started=false;error(e);if(token&&e.status!==401&&e.status!==404){$('download').disabled=false;$('download').hidden=false;$('download').textContent='Retry download';$('message').textContent=e.message+'. Keep this page open to retry within the seven-hour download window.';}}}

 (async()=>{const parts=location.pathname.split('/').filter(Boolean);share=parts[1];if(!share)return;const fragment=location.hash.slice(1);if(!/^[A-Za-z0-9_-]{43}$/.test(fragment)||!/^[A-Za-z0-9_-]{24}$/.test(share))throw Error('This download link is incomplete. Ask the sender for the complete link.');secret=W.unb64(fragment);history.replaceState(null,'',location.pathname);proof=await W.proof(secret);const p=await W.json(`/receive/preview/${share}`,{proof});const k=await W.key(secret,share,'manifest');const plain=await W.open(k,W.unb64(p.manifest),'Vortex manifest '+share);try{manifest=W.validateManifest(JSON.parse(W.decoder.decode(plain)))}finally{plain.fill(0)}$('title').textContent='Your delivery is ready.';$('message').textContent='An encrypted delivery, shared directly with you. Your browser handles the download location.';$('size').textContent=size(manifest.bytes);$('count').textContent=String(manifest.entries.filter(e=>!e.folder).length);$('stats').hidden=false;$('download').hidden=false;
 // The link supplies the entire secret. No code form or account is required.

 })().catch(error);
})();
