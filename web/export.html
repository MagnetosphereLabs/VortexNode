<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vortex · Private download</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#060911;color:#e6edfc}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,#15213c80,transparent 60%)}main{width:min(440px,100%);padding:38px;border:1px solid #9bbcff20;border-radius:26px;background:linear-gradient(145deg,#111a2c,#080d18);box-shadow:0 30px 100px #0007;text-align:center;animation:enter .4s ease-out}svg{width:40px;height:40px;color:#9acaff}h1{font-size:24px;letter-spacing:-.035em;margin:24px 0 12px}p{color:#91a1bf;font-size:13px;line-height:1.7;overflow-wrap:anywhere}.pulse{width:36px;height:36px;border:2px solid #9acaff20;border-top-color:#9acaff;border-radius:50%;margin:26px auto 0;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){main,.pulse{animation:none}}
</style>
<main><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 0 1-.5-10 6 6 0 0 1 11.4 1.4A4.4 4.4 0 0 1 18 18H7Z"/><path d="M12 9v7m-3-3 3 3 3-3"/></svg><h1 id="title">Preparing your download</h1><p id="status">Keep your Vault tab open while your device saves the file.</p><div class="pulse" id="pulse" aria-label="Preparing download"></div></main>
<script>
/*VORTEX_CODEC*/
(()=>{'use strict';const owner=window.opener,nonce=location.hash.slice(1),title=document.getElementById('title'),status=document.getElementById('status');let used=false,port,waiting=false,controller;
 const fail=message=>{title.textContent='Download paused';status.textContent=message;document.getElementById('pulse').hidden=true;try{controller?.error(Error(message));port?.postMessage({error:message});port?.close();}catch{}};
 if(!owner||!/^[A-Za-z0-9_-]{32}$/.test(nonce)){fail('Start a download from your Vortex Vault.');return;}
 const timer=setTimeout(()=>fail('The Vault tab did not respond. Return to it and retry.'),30000);
 window.addEventListener('message',async e=>{if(used||e.source!==owner||e.data?.connect!==nonce||!e.ports[0])return;const {name,size}=e.data;if(typeof name!=='string'||name.length>4096||!Number.isSafeInteger(size)||size<0)return;used=true;clearTimeout(timer);port=e.ports[0];history.replaceState(null,'','/receive/export');window.opener=null;port.onmessage=event=>{waiting=false;try{if(event.data?.bytes instanceof ArrayBuffer)controller.enqueue(new Uint8Array(event.data.bytes));else if(event.data?.done)controller.close();else fail('Return to your Vault tab to retry this download.');}catch{fail('The download was interrupted.');}};
  const stream=new ReadableStream({start(c){controller=c;},pull(){if(!waiting){waiting=true;port.postMessage({pull:true});}},cancel(){port.postMessage({cancel:true});port.close();}},{highWaterMark:0});port.postMessage({ready:true});status.textContent=name;
  try{await VortexWire.download(stream,name,size);title.textContent='Download complete';status.textContent='Your file has been saved by this browser.';document.getElementById('pulse').hidden=true;port.postMessage({complete:true});port.close();setTimeout(()=>window.close(),1200);}catch(error){fail(error.message||'The download was interrupted.');}
 });owner.postMessage({vortexExport:nonce},'*');
})();
</script></html>
