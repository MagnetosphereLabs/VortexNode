[package]
name = "vortex-node"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Private encrypted storage and an end-to-end encrypted transfer relay"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
opaque-ke = { version = "=4.0.0", features = ["argon2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
unicode-normalization = "0.1"
zeroize = "1"
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
